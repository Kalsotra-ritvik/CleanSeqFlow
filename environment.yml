# Authoritative runtime environment for Transcriptomics Preprocessor.
#
# install.sh creates this environment with micromamba. On linux-64 the
# exact package set in environment-lock-linux-64.txt is used by default;
# this file is the human-readable specification the lock was solved from.
#
# Versions were chosen for stability (released months before the lock was
# produced), not simply "latest". Change them only together with a new lock
# file and a full test run (see docs/installation.md).
name: transcriptomics-preprocessor
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - setuptools>=69
  - pyyaml=6.0
  - pytest=8
  - pigz=2.8
  # External bioinformatics tools
  - sra-tools=3.4.1
  - fastqc=0.12.1
  - fastp=1.3.6
  - multiqc=1.35
